name: Build iPhone Native V3 (LoopPhone full Home + camera)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone-rebuild/**'
      - '.github/workflows/iphone-rebuild.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout iPhone rebuild configuration
        uses: actions/checkout@v4

      - name: Fetch native open-source Folio launcher (MIT)
        uses: actions/checkout@v4
        with:
          repository: McCal-Codes/folio
          ref: v0.6.7.3
          path: native-source
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Apply independent launcher display label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path("native-source/app/build.gradle.kts")
          source = file.read_text()
          old = 'manifestPlaceholders["appLabel"] = "Folio Dev"'
          assert old in source, "Expected source version changed. Do not patch blindly."
          file.write_text(source.replace(old, 'manifestPlaceholders["appLabel"] = "iPhone Native V3"'))
          assert 'applicationIdSuffix = ".dev"' in file.read_text(), "Unexpected fast app ID"
          updated = file.read_text().replace('applicationIdSuffix = ".dev"', 'applicationIdSuffix = ".nativev3"', 1)
          file.write_text(updated)
          print("Updated phone launcher label and separate install package; original source credited.")
          PY

      - name: Apply real bottom dock, phone layout and wallpaper gallery
        run: |
          python3 iphone-rebuild/patches/apply_phone_layout.py native-source
          python3 iphone-rebuild/patches/apply_loopphone_v3.py native-source
          unzip -oq iphone-rebuild/assets/wallpaper-pack.zip -d native-source/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          d = Path("native-source/app/src/main/assets/wallpapers")
          assert len(list(d.glob("*.webp"))) >= 18, "Missing bundled wallpapers"
          print("Verified",len(list(d.glob("*.webp"))),"offline artwork files.")
          PY

      - name: Configure dependency mirror fallback (temporary Maven disruption)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("native-source/settings.gradle.kts")
          s=p.read_text()
          s=s.replace('repositories { google(); mavenCentral(); gradlePluginPortal() }',
                      'repositories { maven("https://maven.aliyun.com/repository/gradle-plugin"); maven("https://maven.aliyun.com/repository/google"); maven("https://maven.aliyun.com/repository/public"); google(); mavenCentral(); gradlePluginPortal() }')
          s=s.replace('repositories { google(); mavenCentral() }',
                      'repositories { maven("https://maven.aliyun.com/repository/public"); maven("https://maven.aliyun.com/repository/google"); google(); mavenCentral() }')
          p.write_text(s)
          PY
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Compile optimized installable native Android APK
        working-directory: native-source
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if ./gradlew --no-daemon --stacktrace :app:assembleFast; then exit 0; fi
            sleep 20
          done
          exit 1

      - name: Validate Android application artifact
        run: |
          set -eu
          APK="native-source/app/build/outputs/apk/fast/app-fast.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          cp "$APK" iphone-native-rebuild.apk
          ls -lh iphone-native-rebuild.apk
          sha256sum iphone-native-rebuild.apk

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: iphone-native-v3-debug-apk
          path: iphone-native-rebuild.apk
          if-no-files-found: error
          retention-days: 30

      - name: Preserve complete MIT-licensed launcher source and notices
        run: |
          set -eu
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path("native-source")
          out = Path("iphone-native-rebuild-source.zip")
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=5) as z:
              for p in root.rglob("*"):
                  if not p.is_file(): continue
                  rel = p.relative_to(root)
                  if any(part in (".git", ".gradle", "build") for part in rel.parts): continue
                  z.write(p, str(rel))
          print("Source:", out.stat().st_size, "bytes")
          PY

      - name: Publish source archive and license
        uses: actions/upload-artifact@v4
        with:
          name: iphone-native-v3-source
          path: iphone-native-rebuild-source.zip
          if-no-files-found: error
          retention-days: 30
